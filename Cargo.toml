[package]
name = "codex_cli_voice_bridge_rust"
version = "0.1.0"
edition = "2024"
description = "Rust port scaffold for the Doubao ASR demo and Codex CLI voice bridge"

[lib]
name = "codex_cli_voice_bridge_rust"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
dialoguer = "0.12"
flate2 = "1.1"
futures-util = "0.3"
http = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", features = ["ring"] }
terminal_size = "0.4"
tokio = { version = "1.48", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
unicode-width = "0.2"
uuid = { version = "1.18", features = ["fast-rng", "v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging"
] }
